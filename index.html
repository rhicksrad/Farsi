<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn Farsi by intercepting Persian word-shells across a destructible artillery battlefield."
    />
    <title>Wordfall — Learn Farsi</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Wordfall home">
          <strong>Wordfall</strong>
        </a>

        <label class="difficulty-control">
          <span>Difficulty</span>
          <select data-difficulty>
            <option value="beginner">Beginner · 4 words</option>
            <option value="medium">Medium · 8 words</option>
            <option value="hard">Hard · 20 words</option>
          </select>
        </label>
      </header>

      <main class="game-layout">
        <section class="game-panel" aria-label="Wordfall battlefield">
          <div class="arena" data-arena>

            <svg class="trajectory-layer" data-trajectories aria-hidden="true"></svg>

            <article class="incoming-word" data-target aria-live="polite">
              <span class="target-ring" aria-hidden="true"></span>
              <span class="word-phonetic" data-phonetic></span>
              <span class="word-latin" data-latin></span>
              <strong class="word-persian" data-persian lang="fa" dir="rtl"></strong>
            </article>

            <div class="impact-message" data-message role="status"></div>

            <canvas class="terrain-canvas" data-ground aria-hidden="true"></canvas>

            <aside class="answer-panel" data-answer-panel aria-labelledby="bank-title">
              <div class="bank-heading">
                <h2 id="bank-title">Word bank</h2>
                <strong class="bank-status" data-lives aria-label="Word bank shielded">SHIELDED</strong>
                <span class="bank-count" data-bank-count>4 words</span>
              </div>
              <div class="word-bank" data-word-bank></div>
              <p class="source-note" data-dictionary-status hidden>Loading dictionary status…</p>
              <details class="asset-credits" hidden>
                <summary>Texture credits</summary>
                <p>
                  <a href="https://polyhaven.com/a/rock_ground">Rock Ground</a>
                  by Rob Tuytel via Poly Haven, CC0.
                  Sky: Kloofendal 38d Partly Cloudy by Greg Zaal and Jarod Guest,
                  via Poly Haven, CC0.
                </p>
              </details>
            </aside>

            <div class="game-data" hidden>
              <span data-score>0</span>
              <span data-streak>0</span>
              <span data-best>0</span>
              <span data-instructions></span>
            </div>

            <div class="game-overlay" data-overlay hidden>
              <p class="eyebrow">Word bank hit</p>
              <h2>Rebuild and try again.</h2>
              <p>You scored <strong data-final-score>0</strong> points.</p>
              <button class="primary-button" type="button" data-restart>
                Play again
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
