<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A web-based game for learning Persian (Farsi)."
    />
    <title>Farsi Learning Game</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Farsi learning game</p>
      <section class="card" aria-labelledby="welcome-title">
        <span class="farsi" lang="fa" dir="rtl">سلام!</span>
        <h1 id="welcome-title">Let’s learn Persian.</h1>
        <p>
          The project foundation is ready. Lessons and game mechanics are coming
          next.
        </p>
        <p class="dictionary-status" data-dictionary-status>
          Checking the dictionary…
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
